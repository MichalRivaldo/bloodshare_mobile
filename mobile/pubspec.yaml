name: bloodshare
description: "BloodShare — Aplikasi sosial donor darah mandiri & darurat komunitas"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # State management
  provider: ^6.1.2

  # Local storage (simpan JWT)
  shared_preferences: ^2.3.3

  # Routing
  go_router: ^14.6.2

  # Internationalization & formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
